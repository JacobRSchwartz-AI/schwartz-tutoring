# Publishes a release with tutoring.zip (the skill folder, for Claude.ai uploads)
# whenever a version tag arrives from the GitLab mirror.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tutoring.zip
        run: |
          mkdir -p dist/tutoring
          cp -r plugins/schwartz/skills/tutoring/. dist/tutoring/
          cp LICENSE dist/tutoring/
          (cd dist && zip -qr tutoring.zip tutoring)

      - name: Write release notes
        run: |
          {
            cat <<'EOF'
          **Install in Claude Code**
          ```
          /plugin marketplace add JacobRSchwartz-AI/schwartz-tutoring
          /plugin install schwartz@schwartz-tutoring
          ```

          **Install in Claude.ai or the Claude desktop app:** download `tutoring.zip` below and upload it under Customize > Skills. Code execution has to be turned on.

          **What changed**
          EOF
            # This version's section of the changelog, without its heading.
            awk -v h="## $GITHUB_REF_NAME " 'index($0, h) == 1 { on = 1; next } /^## / { on = 0 } on' \
              plugins/schwartz/skills/tutoring/CHANGELOG.md
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is already released"
          else
            gh release create "$GITHUB_REF_NAME" dist/tutoring.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
