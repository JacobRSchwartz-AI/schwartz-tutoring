# When main has a plugin version with no tag yet, tag it. The push mirror carries
# the tag to GitHub, where .github/workflows/release.yml publishes the release.
# Tags must start here: the mirror deletes tags that exist only on GitHub.
tag-release:
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache git
  script:
    - |
      VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugins/schwartz/.claude-plugin/plugin.json)
      test -n "$VERSION"
      REPO="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      if git ls-remote --exit-code --tags "$REPO" "refs/tags/v$VERSION" > /dev/null; then
        echo "v$VERSION is already tagged"
        exit 0
      fi
    - git tag "v$VERSION" "$CI_COMMIT_SHA"
    - git push "$REPO" "v$VERSION"
